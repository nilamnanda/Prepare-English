<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manda</title>
<meta name="theme-color" content="#1f6fe5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: engineering-English studio — top nav; row 1 = intro cards | live stage (tutor Manda + chat) | today's practice; row 2 = skill meters; row 3 = module tiles */
:root{
  --bg:#f2f6fc; --surface:#ffffff; --soft:#eaf1fc; --line:#dde6f3; --ink:#152238; --muted:#66748a;
  --blue:#1f6fe5; --blue-dk:#164fb0; --blue-soft:#e3edfd; --teal:#14a58c; --teal-soft:#dff5ef; --violet:#7b5ce6; --violet-soft:#ece6fd;
  --coral:#ef5a6f; --coral-soft:#fde6ea; --amber:#f1a92c; --amber-soft:#fff2d9; --on-blue:#ffffff;
  --wall:#dbe8f7; --wall2:#c8dbf2; --desk:#8a6a4e; --desk-top:#a98260; --board:#ffffff;
  --skin:#f7d5bf; --skin-sh:#eab89d; --hair:#5b3422; --hair-hi:#7a4a33; --jacket:#2b5fb8; --jacket-dk:#1f4a93; --lip:#d0566a;
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Nunito",ui-sans-serif,system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --surface:#172133; --soft:#1d2a41; --line:#26354f; --ink:#e8eef8; --muted:#97a6bd;
  --blue:#5b9bff; --blue-dk:#8bb8ff; --blue-soft:#1d3157; --teal:#45d1b4; --teal-soft:#173a35; --violet:#a891ff; --violet-soft:#2b2550;
  --coral:#ff8a9a; --coral-soft:#45222b; --amber:#ffc35c; --amber-soft:#3e321a; --on-blue:#0b1220;
  --wall:#1c2a42; --wall2:#223452; --desk:#4a3a2c; --desk-top:#5d4835; --board:#e9eef6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --surface:#172133; --soft:#1d2a41; --line:#26354f; --ink:#e8eef8; --muted:#97a6bd;
  --blue:#5b9bff; --blue-dk:#8bb8ff; --blue-soft:#1d3157; --teal:#45d1b4; --teal-soft:#173a35; --violet:#a891ff; --violet-soft:#2b2550;
  --coral:#ff8a9a; --coral-soft:#45222b; --amber:#ffc35c; --amber-soft:#3e321a; --on-blue:#0b1220;
  --wall:#1c2a42; --wall2:#223452; --desk:#4a3a2c; --desk-top:#5d4835; --board:#e9eef6;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* top nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.top-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;white-space:nowrap}
.brand .lg{width:36px;height:36px;border-radius:11px;background:var(--blue);display:grid;place-items:center;color:#fff}
.brand .lg svg{width:22px;height:22px}
.brand em{font-style:normal;color:var(--blue)}
.tabs{display:flex;gap:4px;margin-left:10px;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab svg{width:19px;height:19px}
.tab[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.me{display:flex;align-items:center;gap:8px;font-weight:800}
.me .av{width:36px;height:36px;border-radius:50%;background:var(--amber-soft);overflow:hidden}
.iconbtn{border:0;background:none;padding:8px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}

main{max-width:1400px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* home grid */
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;grid-template-areas:"intro stage today";gap:16px;align-items:start}
.intro{grid-area:intro;display:flex;flex-direction:column;gap:14px}
.stagewrap{grid-area:stage;min-width:0}
.today{grid-area:today;display:flex;flex-direction:column;gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.pill svg{width:14px;height:14px;color:var(--amber)}
.intro h1{font-size:30px;line-height:1.12;text-wrap:balance}
.intro h1 b{color:var(--blue)}
.intro p{color:var(--muted);font-weight:600}
.big{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--tint)}
.big .ic{width:50px;height:50px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center}
.big .ic svg{width:26px;height:26px}
.big b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.big span{font-size:13px;color:var(--muted);font-weight:600}
.big .go{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.big .go svg{width:18px;height:18px}
.big:hover{transform:translateY(-1px)}

/* stage */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--wall);min-height:520px}
.scene{position:relative;min-width:0;overflow:hidden}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
.tutor{position:absolute;left:50%;bottom:0;width:min(78%,340px);transform:translateX(-56%)}
.tutor svg{display:block;width:100%;height:auto}
.say{position:absolute;right:14px;top:38%;max-width:200px;background:var(--surface);border-radius:16px;padding:10px 12px;font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(20,34,56,.15)}
.say b{display:block;font-family:var(--f-display);font-size:15px}
.say::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--surface);border-left:0}
.micdock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3}
.microw{display:flex;align-items:center;gap:12px}
.wave{display:flex;align-items:center;gap:3px;height:34px;opacity:.35;transition:opacity .2s}
.wave i{width:3px;border-radius:2px;background:var(--blue);height:30%}
.live .wave{opacity:1}
.live .wave i{animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(5n){animation-delay:.45s}
@keyframes wv{0%,100%{height:20%}50%{height:95%}}
.bigmic{width:76px;height:76px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px color-mix(in srgb,var(--blue) 22%,transparent),0 10px 24px rgba(31,111,229,.35)}
.bigmic svg{width:34px;height:34px}
.bigmic.rec{background:var(--coral);box-shadow:0 0 0 10px color-mix(in srgb,var(--coral) 25%,transparent)}
.miclabel{background:var(--surface);border-radius:10px;padding:3px 10px;font-size:12.5px;font-weight:800;text-align:center;line-height:1.3}
.miclabel span{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.scen-chip{position:absolute;left:14px;top:14px;z-index:3;background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;color:var(--blue);display:flex;gap:6px;align-items:center}

/* tutor animation */
.blink{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mouth-open{display:none}
.talking .mouth-open{display:inline;animation:talk .22s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
.talking .mouth-closed{display:none}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.wavehand{animation:hand 3.6s ease-in-out infinite;transform-origin:226px 300px}
@keyframes hand{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-7deg)}86%{transform:rotate(5deg)}}
.breathe{animation:br 4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
@keyframes br{50%{transform:scaleY(1.008) translateY(-1px)}}
.listening .head{animation:tilt 2s ease-in-out infinite;transform-origin:162px 220px}
@keyframes tilt{50%{transform:rotate(-3deg)}}

/* chat */
.chat{display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);min-width:0;max-height:640px}
.chat-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--blue-soft)}
.chat-h svg{width:18px;height:18px;color:var(--blue)}
.chat-h b{flex:1;font-family:var(--f-display);font-size:14px;color:var(--blue);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--muted);font-weight:800;font-size:12.5px;padding:2px 4px}
.thread{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.m{display:flex;gap:8px;align-items:flex-start}
.m .ava{width:30px;height:30px;border-radius:50%;flex:none;overflow:hidden;background:var(--amber-soft)}
.m .who{font-size:12px;font-weight:800}
.m .who span{font-weight:600;color:var(--muted);margin-left:6px}
.m .bb{background:var(--soft);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.m .tools{display:flex;gap:2px;margin-top:2px}
.m .tools button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:800;padding:2px 6px;border-radius:8px;display:inline-flex;gap:4px;align-items:center}
.m .tools button:hover{background:var(--soft);color:var(--ink)}
.m .tools svg{width:14px;height:14px}
.m .tr{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}
.m.me{flex-direction:row-reverse}
.m.me .bb{background:var(--teal-soft);border-radius:14px 4px 14px 14px}
.m.me .col{display:flex;flex-direction:column;align-items:flex-end;max-width:85%}
.m .col{min-width:0;max-width:85%}
.fix{margin-top:4px;background:var(--amber-soft);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-self:stretch}
.fix.ok{background:var(--teal-soft)}
.fix b{font-weight:800}
.fix .better{font-weight:800;font-size:13.5px}
.fix .acts{display:flex;gap:2px}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dt 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{opacity:.3}30%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.inrow{display:flex;gap:6px;align-items:flex-end;border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 10px;background:var(--bg)}
.inrow:focus-within{border-color:var(--blue)}
.inrow textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;font-weight:600;padding:4px 0;max-height:120px}
.send{width:38px;height:38px;border-radius:11px;border:0;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;flex:none}
.send svg{width:18px;height:18px}
.send[disabled]{opacity:.45}
.hint{font-size:12px;color:var(--muted);font-weight:700}
.err{color:var(--coral);font-size:12.5px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:12px;font-weight:800;font-size:13.5px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn svg{width:16px;height:16px}
.startbox{display:flex;flex-direction:column;gap:10px;padding:4px}
.startbox .btn{align-self:flex-start}

/* feedback inside chat */
.fb{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fb h3{font-size:15px}
.sc3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc3 div{border-radius:10px;padding:8px 4px;text-align:center}
.sc3 b{display:block;font-family:var(--f-display);font-size:20px}
.sc3 span{font-size:11.5px;font-weight:800}
.fb ul{margin:0;padding-left:18px;font-size:13.5px;font-weight:600}
.fx{border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:1px}
.fx .you{text-decoration:line-through;text-decoration-color:var(--coral);color:var(--muted);font-weight:600}
.fx .better{font-weight:800}
.fx .why{font-weight:600;opacity:.8}

/* today */
.todo{padding:16px}
.todo-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.todo-h h2{font-size:18px;display:flex;gap:8px;align-items:center}
.todo-h h2 svg{width:22px;height:22px;color:var(--teal)}
.todo-h span{font-size:12px;color:var(--muted);font-weight:700}
.ring{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:12px 0}
.ring svg{width:96px;height:96px}
.ring b{font-family:var(--f-display);font-size:16px}
.ring p{font-size:13px;color:var(--muted);font-weight:600}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 2px;border-top:1px solid var(--line);text-align:left;font-weight:700}
.task .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.task.done .ck{background:var(--teal);border-color:var(--teal);color:#fff}
.task .ck svg{width:13px;height:13px}
.task span{flex:1}
.task .arr{width:16px;height:16px;color:var(--muted)}
.phrase{padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--violet-soft);border:0}
.phrase .en{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.3}
.phrase .id{font-size:13px;font-weight:600;color:var(--muted)}
.phrase .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cheer{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:14px 16px}
.cheer svg{width:46px;height:46px}
.cheer b{font-family:var(--f-display);color:var(--blue);font-size:16px;display:block}
.cheer span{font-size:13px;color:var(--muted);font-weight:600}

/* skills */
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 0}
.sk{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 18px;align-items:start}
.sk+.sk{border-left:1px solid var(--line)}
.sk .ic{width:50px;height:50px;border-radius:14px;background:var(--tint);color:var(--c);display:grid;place-items:center}
.sk .ic svg{width:26px;height:26px}
.sk .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sk .t b{font-family:var(--f-display);font-size:16px}
.sk .t span{font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.sk p{font-size:12.5px;color:var(--muted);font-weight:600}

/* modules */
.mods-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mods-h h2{font-size:19px}
.mods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mod{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px 8px 8px}
.mod:hover{border-color:var(--blue)}
.mod .th{width:58px;height:58px;border-radius:12px;background:var(--tint);overflow:hidden}
.mod .th svg{width:100%;height:100%}
.mod b{display:block;font-family:var(--f-display);font-size:14px;line-height:1.2;color:var(--ink)}
.mod span{font-size:11.5px;color:var(--muted);font-weight:700}
.mod.active{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}

/* list pages */
.page{display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%;margin:0 auto}
.page h1{font-size:26px}
.plist{display:flex;flex-direction:column;gap:8px}
.pi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px}
.pi .en{font-weight:800;overflow-wrap:anywhere}
.pi .id{font-size:13px;color:var(--muted);font-weight:600}
.pi.learned{opacity:.6}
.pi .acts{display:flex}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);font-weight:700}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.st{padding:14px}
.st b{display:block;font-family:var(--f-display);font-size:26px}
.st span{font-size:12.5px;color:var(--muted);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.wd.on i{background:var(--teal);color:#fff}
.wd i svg{width:15px;height:15px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.backdrop{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet .mods{grid-template-columns:repeat(2,minmax(0,1fr))}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(340px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.bottomnav{display:none}
@media (prefers-reduced-motion:reduce){.blink,.wavehand,.breathe,.live .wave i,.typing i,.talking .mouth-open,.listening .head{animation:none}}

/* responsive */
@media (max-width:1240px){
  .grid{grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"stage today" "intro today"}
  .intro{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .intro .head{grid-column:1/-1}
  .mods{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:980px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "today" "intro"}
  .skills{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sk:nth-child(3){border-left:0}
  .sk:nth-child(n+3){border-top:1px solid var(--line)}
  .tabs .tab span{display:none}
}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr);min-height:0}
  .scene{height:340px}
  .chat{border-left:0;border-top:1px solid var(--line);max-height:none}
  .thread{max-height:none;min-height:180px}
  .tabs{display:none}
  .bottomnav{display:flex;position:fixed;inset:auto 0 0 0;z-index:40;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottomnav .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}
  main{padding-block:12px 96px}
  .intro{grid-template-columns:1fr}
  .intro h1{font-size:25px}
  .mods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me b{display:none}
  .say{top:16px;right:10px;max-width:170px;font-size:12.5px}
  .tutor{width:min(72%,260px);transform:translateX(-62%)}
}
@media (max-width:440px){
  .skills{grid-template-columns:1fr}
  .sk+.sk{border-left:0;border-top:1px solid var(--line)}
  .mod .th{width:48px;height:48px}
}
.authbox{max-width:420px;width:100%;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.authbox .face{width:96px;height:96px;border-radius:50%;overflow:hidden;align-self:center}
.authbox h1{text-align:center;font-size:24px}
.authbox p{text-align:center;color:var(--muted);font-weight:600;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:800;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600;width:100%;min-width:0}
.field input:focus{border-color:var(--blue);outline:none}
.authbox .alt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.okmsg{color:var(--teal);font-size:13px;font-weight:800}
.notice{font-size:13px;background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-weight:700}

async function initStore(){
  if(!FIREBASE_CONFIG.apiKey){S.mode="local";loadLocal();render();return}
  try{
    const [App,A,F,AI]=await Promise.all([import(FB_SDK+"firebase-app.js"),import(FB_SDK+"firebase-auth.js"),import(FB_SDK+"firebase-firestore.js"),import(FB_SDK+"firebase-ai.js")]);
    const app=App.initializeApp(FIREBASE_CONFIG);
    const auth=A.getAuth(app);
    let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    let ai=null;try{ai=AI.getAI(app,{backend:new AI.GoogleAIBackend()})}catch(e){console.error(e)}
    fb={A,F,AI,auth,db,ai,unsub:null};
    A.onAuthStateChanged(auth,u=>{
      if(fb.unsub){fb.unsub();fb.unsub=null}
      if(!u){S.mode="auth";S.ref=null;render();return}
      const ref=F.doc(db,"users",u.uid,"english","progress");
      S.ref={set:d=>F.setDoc(ref,d)};S.mode="cloud";render();
      fb.unsub=F.onSnapshot(ref,s=>{
        if(s.exists()&&!s.metadata.hasPendingWrites){S.prog=normProg(s.data());if(!S.chat)render();else renderSide()}
      },err=>toast("Progres tidak bisa dibaca ("+err.code+"). Cek aturan Firestore di PANDUAN."));
    });
  }catch(e){console.error(e);S.mode="local";loadLocal();render()}
}

function aiErr(e){const m=String((e&&(e.code||""))+" "+(e&&e.message||""));
  if(/429|quota|RESOURCE_EXHAUSTED|rate/i.test(m))return{code:"rate_limited"};
  if(/403|PERMISSION|api-not-enabled|not been used|disabled|API_KEY/i.test(m))return{code:"ai_off"};
  if(/SAFETY|blocked/i.test(m))return{code:"refused"};
  return{code:"upstream_error"}}
async function getSample(){
  if(!fb||!fb.ai)return null;
  const run=async(input)=>{
    let system="",contents=[];
    if(typeof input==="string"){contents=[{role:"user",parts:[{text:input}]}]}
    else{system=input[0].content;const rest=input.slice(1);
      contents=rest.map(t=>({role:t.role==="assistant"?"model":"user",parts:[{text:t.content}]}));
      if(!contents.length||contents[0].role!=="user")contents.unshift({role:"user",parts:[{text:"Start the role-play now."}]})}
    const opts={model:AI_MODEL,generationConfig:{responseMimeType:"application/json",temperature:.8}};
    if(system)opts.systemInstruction=system;
    let res;try{res=await fb.AI.getGenerativeModel(fb.ai,opts).generateContent({contents})}catch(e){console.error(e);throw aiErr(e)}
    let txt="";try{txt=res.response.text()}catch(e){throw{code:"refused"}}
    try{return JSON.parse(txt)}catch(e){const m=txt.match(/[\[{][\s\S]*[\]}]/);if(m){try{return JSON.parse(m[0])}catch(_){}}throw{code:"invalid_json"}}
  };
  return{json:run};
}

function speak(text,rate){
  clearTimeout(talkTimer);
  const fake=()=>{setTalking(true);talkTimer=setTimeout(()=>setTalking(false),Math.min(9000,600+text.split(/\s+/).length*330))};
  if(!TTS){fake();return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate||(S.prog.level==="easy"?.85:.95);
    let started=false;u.onstart=()=>{started=true;setTalking(true)};u.onend=u.onerror=()=>{clearTimeout(talkTimer);setTalking(false)};
    speechSynthesis.speak(u);setTimeout(()=>{if(!started)fake()},700);
  }catch(e){fake()}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,micBlocked=false;
function setListening(on){S.listening=on;const st=document.getElementById("stage");if(st){st.classList.toggle("listening",on);st.classList.toggle("live",on||S.talking)}const b=document.getElementById("bigMic");if(b)b.classList.toggle("rec",on);const l=document.getElementById("micLabel");if(l)l.innerHTML=on?"Aku mendengarkan…<span>ketuk lagi untuk berhenti</span>":"Klik untuk bicara<span>atau pakai mic keyboard</span>"}
function toggleMic(){
  if(!S.chat||S.chat.feedback){startChat((S.scen||todayScen()).id);return}
  const box=document.getElementById("msg");
  if(rec){try{rec.stop()}catch(e){}return}
  if(!SR||micBlocked){micFallback();return}
  try{rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=false;
    const base=box.value?box.value.replace(/\s*$/," "):"";
    rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;box.value=base+t;autosize(box)};
    rec.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){micBlocked=true;micFallback()}};
    rec.onend=()=>{rec=null;setListening(false)};
    rec.start();setListening(true);
  }catch(e){rec=null;micBlocked=true;micFallback()}
}

/* ================= CONVERSATION ================= */
function rules(sc){return `You are Manda, an English speaking coach for Nilam, an Indonesian D4 Electrical Engineering (power systems) student preparing for an engineering internship at an industrial company in Batam, Indonesia.
Role-play: you are ${sc.role}. Stay in character and keep it realistic for an Indonesian industrial workplace.
${LEVEL_TXT[S.prog.level]||LEVEL_TXT.mid}
Nilam's messages come from speech-to-text, so ignore missing punctuation and capitalization; judge grammar, word choice and naturalness.
After each message from Nilam, reply with ONLY a JSON object:
{"reply":"your in-character reply in English, 1-3 short sentences, ending with one question that keeps her talking","fix":{"ok":true or false,"better":"a corrected, natural version of Nilam's last message (empty if ok)","why":"one short explanation in Bahasa Indonesia of the main mistake, or a short compliment in Bahasa Indonesia if ok"},"tr":"Indonesian translation of your reply"}
If Nilam writes in Indonesian, gently ask her in English to try again in English and put the English version in "better".`}
function startChat(id){
  const sc=SCEN.find(s=>s.id===id)||SCEN[0];S.scen=sc;
  S.chat={sc,turns:[{role:"user",content:rules(sc)+"\n\nStart the role-play now."},{role:"assistant",content:sc.open}],ui:[{who:"ai",text:sc.open,time:hhmm()}],feedback:null,fbLoading:false};
  if(S.view!=="home"){S.view="home";render();window.scrollTo(0,0)}else render();
  const st=document.getElementById("stage");if(st&&matchMedia("(max-width:980px)").matches)st.scrollIntoView({behavior:"smooth",block:"start"});
  if(S.autoSpeak)speak(sc.open);
}
async function send(){
  const box=document.getElementById("msg");if(!box||S.busy)return;
  const text=box.value.trim(),err=document.getElementById("chatErr");
  if(!text){err.textContent="Ucapkan atau ketik jawabanmu dulu.";err.hidden=false;return}
  if(rec){try{rec.stop()}catch(e){}}
  const sample=await getSample();
  if(!sample){err.textContent=S.mode==="local"?"Manda belum tersambung. Isi konfigurasi Firebase dulu (lihat PANDUAN).":"Manda belum siap. Muat ulang halaman.";err.hidden=false;return}
  const c=S.chat;c.ui.push({who:"me",text,time:hhmm()});c.turns.push({role:"user",content:text});
  box.value="";S.busy=true;renderChat();
  const input=[{role:"user",content:c.turns[0].content},...c.turns.slice(1).slice(-16)];
  try{
    const r=await sample.json(input,{modelTier:"quick",cache:false});
    const reply=String(r&&r.reply||"").trim()||"Sorry, could you say that again?";
    const me=c.ui[c.ui.length-1];
    if(r&&r.fix){me.fix={ok:!!r.fix.ok,better:String(r.fix.better||""),why:String(r.fix.why||"")};if(!me.fix.ok&&!me.fix.better)me.fix.ok=true}
    c.turns.push({role:"assistant",content:reply});c.ui.push({who:"ai",text:reply,time:hhmm(),trFull:String(r&&r.tr||"")});
    S.busy=false;renderChat();if(S.autoSpeak)speak(reply);
  }catch(e){
    S.busy=false;c.turns.pop();c.ui.pop();renderChat();
    const b=document.getElementById("msg");if(b)b.value=text;
    const er=document.getElementById("chatErr");if(er){er.textContent=errText(e&&e.code);er.hidden=false}
    if(e&&["not_granted","sampling_disabled"].includes(e.code))S.sampleDead=true;
  }
}
async function finish(){
  const c=S.chat,sample=await getSample();if(!sample)return;
  c.fbLoading=true;S.busy=true;renderChat();
  const tr=c.ui.map(m=>(m.who==="ai"?"Partner: ":"Nilam: ")+m.text).join("\n");
  const prompt=`You are an English speaking coach. Below is a role-play transcript ("${c.sc.t}") between Nilam, an Indonesian electrical engineering student preparing for an internship, and her partner. ${LEVEL_TXT[S.prog.level]||""}
Evaluate ONLY Nilam's lines (speech-to-text: ignore punctuation and capitalization).
Reply with ONLY this JSON:
{"scores":{"fluency":1-5,"grammar":1-5,"vocabulary":1-5},"summary":"2 short encouraging sentences in Bahasa Indonesia","strengths":["1-3 short points in Bahasa Indonesia"],"fixes":[{"you":"her original phrase","better":"natural English version","why":"short explanation in Bahasa Indonesia"}],"phrases":[{"en":"useful workplace phrase for this situation","id":"Indonesian meaning"}],"next":"one concrete practice tip for tomorrow in Bahasa Indonesia"}
At most 4 fixes (most important first) and 3-5 phrases.

Transcript:
${tr.slice(-12000)}`;
  try{
    const f=await sample.json(prompt,{cache:false});
    c.feedback=f;c.fbLoading=false;S.busy=false;
    const d=dayRec(today());d.sessions=(d.sessions||0)+1;d.turns=(d.turns||0)+c.ui.filter(m=>m.who==="me").length;d.tasks=d.tasks||[];
    const cat=c.sc.cat;if(!d.tasks.includes(cat))d.tasks.push(cat);
    const sc=f&&f.scores||{};S.prog.sessions.unshift({date:today(),scen:c.sc.id,f:sc.fluency||0,g:sc.grammar||0,v:sc.vocabulary||0});
    if(S.prog.sessions.length>60)S.prog.sessions.length=60;
    save();renderChat();renderSide();toast("Sesi tercatat!");speak(c.sc.cat==="interview"?"Great job today, Nilam!":"Nice work, Nilam! See you tomorrow.");
  }catch(e){c.fbLoading=false;S.busy=false;renderChat();const er=document.getElementById("chatErr");if(er){er.textContent=errText(e&&e.code);er.hidden=false}}
}

function vAuth(){return `<form class="authbox" id="authForm" novalidate><span class="face">${MINI_FACE}</span><h1>Hi Nilam, I'm Manda!</h1>
  <p>Masuk dengan akun yang sama seperti aplikasi Jadwal supaya progres latihanmu tersimpan di HP dan laptop.</p>

document.addEventListener("submit",async e=>{
  if(e.target.id!=="authForm")return;e.preventDefault();
  const mode=(e.submitter&&e.submitter.dataset.mode)||"login";
  const email=document.getElementById("a-email").value.trim(),pass=document.getElementById("a-pass").value;

  try{if(mode==="signup")await fb.A.createUserWithEmailAndPassword(fb.auth,email,pass);
    else if(mode==="reset"){await fb.A.sendPasswordResetEmail(fb.auth,email);ok.textContent="Link ganti kata sandi sudah dikirim ke email kamu.";ok.hidden=false}
    else await fb.A.signInWithEmailAndPassword(fb.auth,email,pass)}
  catch(x){er.textContent=AUTH_ERR[x.code]||("Gagal: "+(x.code||x.message));er.hidden=false}
});

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.closest("#authForm"))return;
  const root=document.getElementById("modalRoot");
  if(b.id==="logoutBtn"){if(b.dataset.armed){S.chat=null;fb&&fb.A.signOut(fb.auth)}else{b.dataset.armed="1";b.style.color="var(--coral)";b.title="Ketuk lagi untuk keluar";toast("Ketuk sekali lagi untuk keluar");setTimeout(()=>{delete b.dataset.armed;b.style.color=""},3000)}return}
  if(b.hasAttribute("data-close")){root.innerHTML="";return}
  if(b.dataset.view){S.view=b.dataset.view;render();window.scrollTo(0,0);return}
  if(b.id==="themeBtn"){const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("su-theme",n)}catch(_){}return}
  if(b.dataset.start){root.innerHTML="";if(S.busy)return;startChat(b.dataset.start);return}
  if(b.dataset.pick){if(S.busy)return;const sc=SCEN.find(s=>s.id===b.dataset.pick);if(S.chat&&!S.chat.feedback&&S.chat.ui.length>1){startChat(sc.id)}else{S.chat=null;S.scen=sc;render();const st=document.getElementById("stage");st&&st.scrollIntoView({behavior:"smooth",block:"start"})}return}
  if(b.id==="changeBtn"||b.id==="changeBtn2"){if(S.busy)return;openPicker();return}
  if(b.dataset.say!==undefined){speak(b.dataset.say);return}
  if(b.dataset.saySlow!==undefined){speak(b.dataset.saySlow,.7);return}
  if(b.dataset.saveEn!==undefined){addPhrase(b.dataset.saveEn,b.dataset.saveId);if(S.view==="vocab")render();return}
  if(b.dataset.level){S.prog.level=b.dataset.level;save();if(S.view==="home")renderChat();else render();return}
  if(b.dataset.tr!==undefined){const m=S.chat&&S.chat.ui[+b.dataset.tr];if(m){m.tr=m.tr?"":m.trFull;renderChat()}return}
  if(b.dataset.learn!==undefined){const p=S.prog.phrases[+b.dataset.learn];if(p){p.learned=!p.learned;if(p.learned)p.learnedOn=today();save();render();
      if(S.prog.phrases.filter(x=>x.learned&&x.learnedOn===today()).length>=3)markTask("vocab")}return}
  if(b.dataset.del!==undefined){if(b.dataset.armed){S.prog.phrases.splice(+b.dataset.del,1);save();render()}else{b.dataset.armed="1";b.style.color="var(--coral)";b.title="Ketuk lagi untuk hapus";setTimeout(()=>{delete b.dataset.armed;b.style.color=""},2500)}return}
  if(b.dataset.task){const t=b.dataset.task;
    if(t==="phrase"){const pc=document.getElementById("phraseCard");pc&&pc.scrollIntoView({behavior:"smooth",block:"center"});speak(todayPhrase()[0]);return}
    if(t==="vocab"){S.view="vocab";render();window.scrollTo(0,0);return}
    const pool=SCEN.filter(s=>s.cat===t);startChat(pool[dayNo()%pool.length].id);return}
  if(b.id==="phraseDone"){markTask("phrase");return}
  if(b.id==="bigMic"){toggleMic();return}
  if(b.id==="sendBtn"){send();return}
  if(b.id==="finishBtn"){finish();return}
});
document.addEventListener("change",e=>{if(e.target.id==="autoSpk"){S.autoSpeak=e.target.checked;try{localStorage.setItem("su-auto",S.autoSpeak?"1":"0")}catch(_){}}});

render();
initStore();
})();
</script>
